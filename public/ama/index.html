<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMA · MERIT VDemo</title><link rel="stylesheet" href="/surfaces.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="/">MERIT VDemo<small>Ask and answer</small></a><nav class="nav"><a href="/portal/">Portal</a><a href="/journal/">Journal</a><a href="/play/">Play</a></nav></header><main><section class="section"><p class="eyebrow">COMMUNITY</p><h1>Questions make a shared room.</h1><p class="lede">Use this reference surface to collect questions, responses, and votes while the V01 tenant plane enforces app and subscriber boundaries.</p><div class="panel"><form class="form" id="ama-form"><label>Question<input id="ama-question" required placeholder="What would you like to explore?"></label><button class="primary" type="submit">Ask the community</button></form><p class="status" id="ama-status" role="status">No question posted yet.</p><div id="ama-board"></div></div></section></main><footer><a href="/portal/">Portal</a><a href="/legal.html">Legal</a></footer></div><script>const f=document.querySelector('#ama-form'),q=document.querySelector('#ama-question'),s=document.querySelector('#ama-status'),b=document.querySelector('#ama-board');f.addEventListener('submit',ev=>{ev.preventDefault();const v=q.value.trim();if(!v)return;s.textContent='Question staged locally; connect the authenticated adapter to publish.';const p=document.createElement('p');p.textContent=v;p.className='card';b.prepend(p);q.value='';});</script></body></html>
