<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journal · MERIT VDemo</title><link rel="stylesheet" href="/surfaces.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="/">MERIT VDemo<small>Private journal</small></a><nav class="nav"><a href="/portal/">Portal</a><a href="/ama/">AMA</a><a href="/play/">Play</a></nav></header><main><section class="section"><p class="eyebrow">PRIVATE BY DEFAULT</p><h1>Make space for the next thought.</h1><p class="lede">This page demonstrates the journal journey. The browser form is local-first; the authenticated adapter persists through the V01 tenant route.</p><div class="panel"><form class="form" id="journal-form"><label>Entry<textarea id="journal-entry" required placeholder="Write a note for yourself"></textarea></label><button class="primary" type="submit">Save private entry</button></form><p class="status" id="journal-status" role="status">Ready for a local preview.</p><div id="journal-list"></div></div></section></main><footer><a href="/portal/">Portal</a><a href="/legal.html">Legal</a></footer></div><script>const f=document.querySelector('#journal-form'),e=document.querySelector('#journal-entry'),s=document.querySelector('#journal-status'),l=document.querySelector('#journal-list');f.addEventListener('submit',ev=>{ev.preventDefault();const v=e.value.trim();if(!v)return;s.textContent='Saved locally; connect the server adapter for hosted persistence.';const p=document.createElement('p');p.textContent=v;p.className='card';l.prepend(p);e.value='';});</script></body></html>
